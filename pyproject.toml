[project]
name = "turnwise"
version = "0.1.0"
description = "Local full-duplex streaming voice agent. This release is the event bus through streaming TTS (silence stub by default; optional CPU Piper) and optional CPU Zipformer ASR (stub by default), paralinguistic courtesy, a scripted eval harness, and production hardening (turn traces, load knee, degradation drills, compose)."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "opentelemetry-api>=1.27.0",
  "opentelemetry-exporter-otlp-proto-grpc>=1.27.0",
  "opentelemetry-sdk>=1.27.0",
  "prometheus-client>=0.21.0",
  "pydantic>=2.6.0",
  "pydantic-settings>=2.6.0",
  "structlog>=24.4.0",
  "uvicorn>=0.32.0",
  "websockets>=14.0",
  "numpy>=1.26.0",
  "onnx>=1.16.0",
  "onnxruntime>=1.20.0",
  "tzdata>=2024.1",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
tts = [
    "piper-tts>=1.8.0",
]
asr = [
    "sherpa-onnx>=2.0.3",
    "sentencepiece>=0.1.99",
]
whisper = [
    "faster-whisper>=1.1.0",
]

[dependency-groups]
dev = [
  "httpx>=0.27.0",
  "mypy>=1.13.0",
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
  "server",
  "pipeline",
  "models",
  "dialogue",
  "nlp",
  "tools",
  "evals",
  "training",
]

[tool.uv]
package = true

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["docs", "client"]
src = [
  "server",
  "pipeline",
  "models",
  "dialogue",
  "nlp",
  "tools",
  "evals",
  "training",
  "tests",
  "scripts",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF", "ANN", "A", "C4", "PTH", "RET"]

[tool.ruff.lint.per-file-ignores]
# Plan T6.4.1 names this module. The stdlib calendar is unused in this package.
"tools/calendar.py" = ["A005"]

[tool.ruff.lint.isort]
known-first-party = [
  "dialogue",
  "evals",
  "models",
  "nlp",
  "pipeline",
  "scripts",
  "server",
  "tools",
  "training",
]

[tool.mypy]
strict = true
python_version = "3.11"
mypy_path = "."
warn_unused_configs = true
packages = [
  "server",
  "pipeline",
  "models",
  "dialogue",
  "nlp",
  "tools",
  "evals",
  "training",
  "scripts",
]

[[tool.mypy.overrides]]
module = [
  "onnxruntime",
  "onnxruntime.*",
  "onnx",
  "onnx.*",
  "numpy",
  "numpy.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
  "nemo_text_processing",
  "nemo_text_processing.*",
  "transformers",
  "funasr",
  "yaml",
  "piper",
  "piper.*",
  "sherpa_onnx",
  "sherpa_onnx.*",
  "sentencepiece",
  "faster_whisper",
  "faster_whisper.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
addopts = "-q"
markers = [
  "bench: talks to optional local model binaries; not required on default CI",
]
