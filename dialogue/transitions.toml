# Appendix C is the spec. Guards and actions are named functions, not eval.

states = [
  "GREET",
  "IDENTIFY_PATIENT",
  "COLLECT_INTENT",
  "COLLECT_SLOTS",
  "CONFIRM",
  "EXECUTE",
  "CLOSE",
  "URGENT",
  "HANDOFF",
  "FAQ",
]

[[row]]
state = "*"
except = ["URGENT"]
event = "urgent_keyword"
guard = "kw"
action = "urgent_message"
next_state = "URGENT"

[[row]]
state = "*"
except = ["HANDOFF"]
event = "speak_to_human"
guard = "none"
action = "handoff"
next_state = "HANDOFF"

[[row]]
state = "*"
except = ["HANDOFF", "URGENT"]
event = "asr_collapse"
guard = "none"
action = "handoff_asr"
next_state = "HANDOFF"

[[row]]
state = "*"
except = ["HANDOFF"]
event = "offer_human_yes"
guard = "offer_latched"
action = "handoff"
next_state = "HANDOFF"

