# Local observability stack. A down Jaeger does not change voice behavior:
# the app's OTLP batch queue is bounded and drops spans when the collector is full.
services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      TURNWISE_HTTP_HOST: 0.0.0.0
      TURNWISE_LOG_JSON: "true"
      TURNWISE_OTEL_ENABLED: "true"
      TURNWISE_OTEL_ENDPOINT: http://jaeger:4317
      TURNWISE_OTEL_INSECURE: "true"
    ports:
      - "8000:8000"
    depends_on:
      - jaeger
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 10s
      timeout: 3s
      retries: 5

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      app:
        condition: service_healthy

  grafana:
    image: grafana/grafana:11.3.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
    # OTLP stays on the compose network (jaeger:4317). Publishing 4317 on the host
    # collides with a local collector and is not required for the app container.
