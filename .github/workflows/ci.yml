name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Install
        run: uv sync --frozen --all-groups
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Typecheck
        run: uv run mypy server pipeline models dialogue nlp tools evals training tests
      - name: Test
        run: uv run pytest
