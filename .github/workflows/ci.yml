name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Install
        run: uv sync --frozen --all-groups
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Typecheck
        run: uv run mypy --strict server pipeline models dialogue nlp tools evals training tests scripts
      - name: Test
        run: uv run pytest
      - name: Eval smoke
        run: uv run python -m evals.smoke_gate --write-only --artifact docs/results/smoke_artifact.json
